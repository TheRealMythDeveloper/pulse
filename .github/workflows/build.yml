
name: Build Pulse

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Pulse
        run: npm run build

      - name: Save browser extension build
        uses: actions/upload-artifact@v4
        with:
          name: pulse-browser-build
          path: dist/
